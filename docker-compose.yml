# Local PostgreSQL (with PostGIS for the upcoming GIS layer).
#   docker compose up -d db
#   DATABASE_URL=postgres://tgcg:tgcg@localhost:5432/tgcg
services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: tgcg
      POSTGRES_USER: tgcg
      POSTGRES_PASSWORD: tgcg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgcg -d tgcg"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
